<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function throttle(fn, delay) {
            let shouldWait = false;

            return function (...args) {
                if (shouldWait) {
                    return;
                }

                fn.apply(this, args);

                shouldWait = true;

                setTimeout(() => {
                    shouldWait = false;
                }, delay);
            };
        }

        function fn (){
            console.log("mouseover triggers")
        }
        const throttledMouseOver = throttle(fn, 5000);
    </script>
</head>
<body>
<input id="search" placeholder="Search..."  onmouseover="throttledMouseOver()"/>
</body>
</html>
